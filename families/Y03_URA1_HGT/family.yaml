notes: 'Root H (T1, Hall 2005; Gojkovic 2004): URA1 (family 1A DHOD) entered the Saccharomycetaceae by HGT from Lactobacillales
  (donor OUTSIDE panel) -> URA1 xenologs and native family-2 (URA9-type) DHODs are never in one HOG at any level. URA1 subtree
  = YGOB pillar (synteny): KLE pair, ZT pair and KLE-vs-ZT are S (T2); post-WGD URA1 genes (YEAST, NAUCC, TETPH) hang from
  a U node (valid under both panel trees) (pillar slots carry no track; YGOB v1 scores URA1 as non-syntenic in S. cerevisiae/S.
  castellii). URA9 subtree = Bouwknegt 2021 Ura9 orthologs + Hall 2005 accessions; U except the Eremothecium pair (BS 94,
  T3). Species with both types: LACTH, TETPH (KLULA has both per Hall 2005 but its family-2 gene has no identifier in any
  source -> only URA1 listed). No member for NAUDC, KAZAF. YGOB unit YGOB_L04856 of Y01 holds the same 7 URA1 genes (gene-ownership
  overlap; one of the two must drop them in the panel set).'

notes: 'One of three E07 families split from Hirst et al. 2014 by subunit homology class (large; medium+small; COPI/TSET scaffold),
  because the classes are not asserted homologous to each other. Tree: root = T1 D (lvl_lo=Eukaryota, lvl_hi=ABOVE_RANGE)
  over subunit groups (section of Figure 3-source data 1; AP subunits from the annotation code <complex><B|M|S|G|A|D|E|Z>),
  all pre-LECA paralogs per the quoted AP-1..5 / COPI / TSET statements. AP-1 and AP-2 beta labels (1B/2B) pooled into one
  U group: the paper does not resolve a beta1/beta2 split. Groups: <=1 gene/species -> S, else U. Rows whose annotation does
  not parse consistently with its section are loose under a U root. Table lists sequences used for phylogenies (not exhaustive
  for AP/COPI; opisthokont AP/COPI sampling sparse) -> complete_species empty. Mapping: RefSeq/GenBank/UniProt/SGD -> UniProt
  ID mapping; else exact gene-model name in the panel header map (AGI, DDB_G, BDEG_, CAOG_, Cre, NCU, CYME_, GL50803_); else
  NCBI sequence of the RefSeq id with an exact (or unique >=99.5%, cov >=0.8 both) same-species match. JGI numeric/EST ids
  are unmapped. DICDI TSET genes (XP_639969, XP_640471, XP_629998) are absent from the panel proteome.'

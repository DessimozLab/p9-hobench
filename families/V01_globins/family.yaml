notes: 'Members are the representative sequences of Hoffmann 2012b Table S1 (one alpha- and one beta-Hb per gnathostome species,
  not the full clusters) -> no complete_species. Hb cluster tandem copies, Opazo 2008 embryonic genes and teleost 3R Hb clusters
  (Opazo 2013) are not encoded. Lamprey Hbs (Table S1 sea-lamprey entries) placed under U with the Cygb/Mb/GbE subtree because
  their orthology to Cygb (Hoffmann 2010) vs co-orthology to Cygb+Mb+GbE depends on the contested 2R timing; the scored claim
  is lamprey Hb vs gnathostome alpha/beta-Hb/GbY = paralogs (1R, Vertebrata). Hoffmann 2012a Table S1 and Hoffmann 2010 sd01
  were not received; the received item #04 is Hoffmann 2012b.'

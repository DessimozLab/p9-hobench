notes: 'Scope = visual opsins only (Lagman S1 ''OPN'' main section). complete_species empty: Lagman searched Ensembl assemblies
  of 2013 (chicken lacked 3 of 5 genes in WASHUC2; frog RH2 possibly assembly gap). Gar members mapped by Ensembl locus overlap
  at the S1 gene-start coordinate (LepOcu1, still the Ensembl gar assembly); gar IDs printed in S1 are the query proteins
  of other species. Ramirez 2016 Table T1 lists database protein names only (no per-sequence classification) and was not used
  for membership; non-visual opsins therefore not covered. Root level Vertebrata with lvl_hi=ABOVE_RANGE: the SWS/LWS split
  predates 2R; Ciona/amphioxus visual-opsin relatives not classified by the source.'

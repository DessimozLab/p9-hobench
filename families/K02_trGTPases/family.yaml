notes: 'Root D (T1): EF-Tu vs EF-G duplication predates LUCA -> the two groups are never in one HOG within the panel. Within
  each group, single-copy species form an S polytomy (T2; archaeal EF-1alpha/EF-2 are the cross-domain counterparts of EF-Tu/EF-G
  per Creti 1994). Species with several COG members (EF-Tu: ECOLI tufA/tufB, distinct UniProt entries; EF-G: EF-G paralogs
  in several bacteria) hang from a U node (no source resolves them). Identical tuf copies collapsed to one UniProt entry (PSEAE,
  DEIRA, AQUAE) count once. IF2, LepA, SelB, RF3, BipA/TypA, aIF2gamma not included (no source in hand asserts their placement).
  BRADU/GEOSL absent from COG 2020 -> no members.'

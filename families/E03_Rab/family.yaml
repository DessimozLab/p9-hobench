notes: 'Root = T1 D over the six supergroups (pre-LECA, interval [Eukaryota, ABOVE_RANGE]); each supergroup = U wrapper over
  a T1 D splitting its LECA Rabs, plus loose genes whose label is not quote-assigned to one LECA Rab (Ypt1, Sec4, Ypt7, Ypt51/53,
  Ypt3, Ypt6, Rab19/33/34/43/44/45, Rab25, Rab36/37, Rab42, RabX2, composite/partial labels; supergroup known from the alignment
  file). LECA Rab node = U over label groups (core label + quoted metazoan-derived labels); undated metazoan splits are not
  asserted. T1 nested D: Rab9 vs opisthokont Rab7 at Opisthokonta; Rab40 vs bilaterian Rab18 at Bilateria; vertebrate duplications
  (Rab5a/b/c/17, Rab8a/8b/13/12, Rab22a/b, Rab32/38, Rab4a/b, Rab6a/b/c/41) as D over the HUMAN copies (HUMAN = only vertebrate).
  Label groups: <=1 gene/species -> S; else U (T2 rules b/c). Mapping: no accessions; degapped alignment sequences (authors
  removed gap-rich columns) -> same-species DIAMOND; identity computed over aligned residue pairs (trimmed columns appear
  as gaps), coverage of both sequences >= 80% by aligned span, RBH, margin >= 2. complete_species empty: alignments are HMM
  training subsets, no statement that they list every Rab of a species. Source_method HMM_classification (iterative HMM +
  tree; not a denylisted tool). Elias et al. 2012 (J Cell Sci, PMID 22366452) fetched (PMC HTML, supplements not retrievable)
  but not used for assertions. Panel-E eukaryotes absent from the source alignments: BATDJ, CYAME, DICDI, ENCCU, ENTH1, GIAIC,
  ICHMU, MNELE, NEUCR, THETR. Homology: Rab and Arf/Sar are homologous Ras-superfamily GTPases; no distinct_from with E02_ARF.'

notes: 'Subfamily membership from the Suppl. Fig. S2 table (pypdf text). Subfamily ages follow the paper: the 20 subfamilies
  with moss members existed in the moss/vascular ancestor (D lo=Embryophyta), subfamilies with lycophyte+angiosperm members
  only (lo=Tracheophyta) and angiosperm-only subfamilies (lo=Mesangiospermae); all upper bounds ABOVE_RANGE because inter-subfamily
  relationships are unresolved (paper: basal nodes have low support). Orphans and the chlorophyte proteins: U. Inside subfamilies:
  U (paralogs; WGD lineages; no synteny curation). Pairs between the three age groups are U (the paper does not identify the
  parent subfamily of the younger subfamilies).'

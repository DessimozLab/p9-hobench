notes: 'Scope v1: species with an expert nomenclature authority (HGNC, MGI, ZFIN, Xenbase); gar, medaka, salmon, coelacanth,
  shark, lamprey and amphioxus Hox lack machine-readable OA expert tables (Braasch 2016 gar-teleost tables use Ensembl Compara
  GeneTrees -> denylisted; Amores 1998, Kuraku & Meyer 2009, Mungpakdee 2008 not OA/not retrieved). The 2R interval and the
  pre-2R paralog-group splits lie above the members'' LCA (Euteleostomi), so cross-cluster and cross-PG pairs have merge level
  ''never within range''. complete_species = species with >=90% of authority Hox symbols mapped (authority lists are genome-wide
  nomenclature sets).'

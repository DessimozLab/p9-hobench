notes: 'Root D node TUB_LECA (T1; lvl_lo=Eukaryota, lvl_hi=ABOVE_RANGE) separates the six classes Tub1-6 (alpha..zeta): the
  paper infers an ancestor of each subfamily in the LCA of eukaryotes. Class numbers: the paper states numbers replace Greek
  letters (Tub1=alpha, Tub3=gamma quoted; Tub2=beta from ''beta-tubulins Tub2D and Tub2E''); Tub4/5/6 = delta/epsilon/zeta
  follows the Greek order (consistent with Table 1 counts and human Tub4=chr17 TUBD1, Tub5=chr6 TUBE1 in Suppl. Table S3);
  only the class split matters for the tree. Within a class: <=1 mapped gene per species -> S polytomy (T2 rule b; no two
  panel-E species share a WGD); >1 in any species -> U (rule c; alpha/beta). FtsZ/TubZ/artubulin and Prosthecobacter BtubA/B
  are outgroups in the paper and not members; the panel has FtsZ in bacteria/archaea (paper: ''The proposed archaeal homologs
  grouped together with the bacterial TubZ proteins as sister clade to the FtsZ proteins indicating that tubulins are unique
  to eukaryotes.''), but no FtsZ family is curated, so no distinct_from is declared. Panel-E eukaryotes absent from the source:
  MNELE. Strains: YEAST=S288c (Sc_c), BATDJ=JAM81 (Bad_b), PLAF7=3D7 (Pf_a); GIAIC: source has Giardia ATCC 50581 (assemblage
  B/GS) vs panel WB (assemblage A) -> mostly unmapped (<98%). Sequences were annotated by the authors from genome assemblies,
  so some differ from UniProt gene models (<98%).'

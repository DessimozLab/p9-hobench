notes: 'Classes are the paper''s labels (Supplementary table 1). Inter-class relations are only asserted where the paper dates
  the class origins (TALE vs non-TALE and KNOX vs BEL before plants; DDT, WOX, PINTOX in the green-plant ancestor; HD-ZIP
  I-IV after the Chlorophyta/Streptophyta split and before the moss/vascular split; KNOX I vs II before the moss/vascular
  split). Land-plant classes PLINC/PHD/NDX/LD/SAWADEE relative to each other and to DDT/WOX/PINTOX: U (parent class not identified;
  the paper says inter-class topology is poorly supported). Within classes: U (many paralogs; WGD-descended lineages, no synteny
  curation), except chlorophyte-vs-land S nodes for DDT/WOX/PINTOX. Rows labelled with codomains but no homeodomain (START
  ONLY, PLINC ONLY, MEKHLA ONLY, ...) and pseudogenes are excluded. ORYSJ includes rows coded ''Os'' and ''Os_j'' (O. sativa;
  the searched genome is japonica). Non-genome-wide species (VITVI, SOYBN, BRARP, PHAVU) contribute EST/cDNA-based rows only.'

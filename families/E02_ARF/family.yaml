notes: 'Journal is Genome Biol Evol (not MBE). Tree: root U; ARF_LECA = multifurcating T1 D over the 16 LECA paralogs (15
  + SRbeta; interval [Eukaryota, ABOVE_RANGE]). Arf1 child = U ''Arf1_complex'' holding non-holozoan Arf1, a T1 D at Holozoa
  (holozoan Arf1 vs Arf4, holozoan-stem origin of Arf4) and TRIM23 (derived from Arf1). Vertebrate Arf1/Arf4/Arl4 duplications
  -> D at the HUMAN leaf branch (only vertebrate in panel E). Labels: only rows marked ''Conclusively annotated'' (*) are
  grouped (S if <=1 gene per species, multi-copy species under U; T2 rules b/c; no two panel-E species share a WGD, so rule-b
  pseudo-orthology exception does not apply); non-conclusive and ''unannotated'' rows hang from the root U. Holozoa/Metazoa-specific
  groups (Arl4, 10, 15, 19, 20), ArfB, Arf1/6, ArlRhodo, Arl11/14, Arl13L stay at root U (source paralog not resolved in the
  paper). Excluded: pseudogenes, identical copies (paper notes / ''Number of genes'' > 1). Mapping: RefSeq/GenBank -> UniProt
  ID mapping, else same-species DIAMOND of the paper''s protein (dataset 1) with protocol thresholds. Panel-E eukaryotes absent
  from the source: ENCCU, ICHMU, PHYRM (source has Phytophthora sojae, Tetrahymena/Paramecium, no microsporidia). Homology:
  Arf/Sar and Rab are homologous Ras-superfamily small GTPases (no distinct_from with E03_Rab).'

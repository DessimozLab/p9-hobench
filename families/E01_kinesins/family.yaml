notes: 'Kinesin-myosin homology: kinesin and myosin motor domains share a common P-loop NTPase fold/ancestry, so no distinct_from
  is declared between E01_kinesins and E06_myosins (homologous at fold level, but no orthology/paralogy level asserted). D
  nodes: (1) KIN_MAR_LECA = split among the 10 MAR families (Kinesin-9 counted once; 9A/9B split is the separate D node K9A_9B_LECA),
  both lvl=Eukaryota with interval [Eukaryota, ABOVE_RANGE] (paper infers presence in the LCEA; the duplications may be older).
  Non-MAR families (6, 7, 15, 16, 18, 19, 20), tentative X1-X14 groups, parenthesised (uncertain) family labels and ''ungrouped''
  sequences hang from the U root (no assertion against MAR families). Within a family, subfamily splits are undated in the
  paper -> U. Terminal label groups: <=1 gene per species -> S polytomy (T2 rule b; no two panel-E species share a WGD, so
  rule-b pseudo-orthology exception does not apply); >1 gene in a species -> U (rule c). Mapping: GenBank/RefSeq -> UniProt
  ID mapping or exact gene-model names (JGI DRAFT names) in the panel proteome, cross-checked with the paper''s motor-domain
  sequence (DatasetS1); rows with only a motor-domain sequence (no ID route) fail the 80% target-coverage rule and are reported
  unmapped. Source used old (2006-2007) proteome versions; Batde = strain JEL423 (panel JAM81). Panel-E eukaryotes absent
  from the source: AMPQE, MNELE, CAPO3, PHYRM, THETR, ICHMU (source has Phytophthora sojae, not P. ramorum; source code ''Capsp''
  is the annelid Capitella sp. I, not Capsaspora). complete_species = species with a genome-wide HMMER search in the source
  and >=90% of in-panel rows uniquely mapped; caveat: current gene models may contain kinesins absent from the 2007 datasets.'
completeness_quote: From these datasets, we extracted complete kinesin repertoires using HMMERv2.3.2 [22] to find all predicted
  proteins with a match to the Pfam 'kinesin motor domain' profile (PF00225; [69]).

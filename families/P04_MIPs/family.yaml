notes: 'Root is U: PpGIP1;1 is a GlpF-like MIP xenolog (HGT, donor outside panel P); an H node would force the native subfamily
  D to Embryophyta, so GIP vs native pairs are left unasserted (tag HGT). The six native subfamilies were present in the land-plant
  ancestor (GIP lost before lycophytes, HIP lost in seed plants, XIP lost in monocots and Arabidopsis). TIP groups 1-5 evolved
  in the seed-plant ancestor (panel branch into Magnoliopsida). SIP2 evolved in angiosperms (interval Mesangiospermae..Magnoliopsida);
  P. patens SIP1s vs angiosperm SIP1/SIP2 = S at Embryophyta. NIPs: U (A. thaliana NIP1-7 vs monocot NIP1-4 nomenclatures
  are not comparable). Selaginella MIPs (Anderberg 2012) not included: only scaffold coordinates are published, no sequences/ids.
  Rice names follow the monocot scheme; maize and Arabidopsis follow DJ2008.'

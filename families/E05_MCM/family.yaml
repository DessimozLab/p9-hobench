completeness_quote: These multiple BLAST searches using paralogous genes as search seeds were conducted to ensure that all
  available paralogues were sampled from each of the target genomes.
notes: 'Root S (T1) joins the single Halobacterium MCM (paper: one MCM per archaeon except M. jannaschii) with the eukaryotic
  Mcm2-9 set; MCM_LECA_DUPS is one multifurcating D node for the seven pre-LECA duplications (branching order unresolved in
  the paper: ''Both phylogenetic analyses failed to resolve the branching relationship''), lvl_lo=Eukaryota, lvl_hi=Asgard_Eukaryota
  because the sampled Euryarchaeota and TACK (Sulfolobus, Thermofilum) carry a single MCM; no Asgard archaea were sampled.
  Per paralogue: <=1 gene per species -> S polytomy (T2 rule b; no two panel-E species share a WGD). Naegleria has two Mcm3
  (T1 recent duplication, D at NAEGR). Source errors handled: accessions printed under two paralogues (N. crassa XP_965670
  Mcm4/Mcm7, T. brucei XP_951609 Mcm3/Mcm7, M. brevicollis Monbr1:32709 Mcm8/Mcm9) -> ambiguous; accessions that resolve to
  non-MCM proteins (S. cerevisiae NP_010883 = SPF1; E. histolytica XP_754207 = Aspergillus protein) -> excluded by homology
  QC. Table 1 lists Nematostella Mcm8/9 as absent, while Additional file 4, Additional file 7 (NvMcm8/NvMcm9) and the Methods
  animal Mcm8/9 list include them; the figure labels are used. Panel archaea other than HALSA (SACS2, THEKO, NITMS, LOKOS)
  and all bacteria were not sampled by the paper; their MCMs are not members (incompleteness, not absence).'

notes: 'Merge-test decoy family. P-loop shikimate kinase (bacterial AroK/AroL) (COG COG0703) and its partner K04h_SK_GHMP
  catalyse the same reaction (EC 2.7.1.71) with different structural folds (Omelchenko et al. 2010, Table S2: ''Two distinct
  structural folds'') => non-homologous: they must never share a HOG at any level (distinct_from at_level ALL; decoys = partner
  members). Inside the family the tree is a single U node (no orthology asserted: no source in hand separates orthologs from
  xenologs/paralogs; LysRS-I and several SODs/SKs are HGT-prone). Members = COG 2020 membership (class 0-2) in the 19 panel-K
  genomes present in COG 2020; BRADU/GEOSL absent from COG 2020 (no member data). Same pairs can be re-declared in panel E.'

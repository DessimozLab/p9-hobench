notes: 'CXE members are those listed in Dataset S2 (Marshall et al. 2003 sets for At/Os/Sm/Pp, partial; not a complete CXE
  inventory -> no complete_species). GID1 types (A/B eudicot, M monocot, BA Amborella, L lycophyte) follow the gene names/Fig.
  3. D_GID1_origin separates GID1 from the tracheophyte CXEs listed (lo=Tracheophyta, hi=ABOVE_RANGE: the progenitor CXE lineage
  is not identified, so only ''separate at Tracheophyta and below'' is asserted); moss CXEs and the lycophyte GID1s vs seed-plant
  GID1s are U. D_GID1_AB at the panel branch into Rosids (no basal eudicot in panel P; the gamma hexaploidy is on the same
  branch but the paper does not attribute the split to it, so no WGD tag). Within types: U (Glycine/Phaseolus/Brassicaceae
  copies; WGD lineages).'

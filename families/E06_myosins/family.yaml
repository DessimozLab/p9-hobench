completeness_quote: In addition, we performed TBLASTN searches in the respective genomes with myosins from different classes.
notes: 'T1 D node MYO_LECA (lvl_lo=Eukaryota, lvl_hi=ABOVE_RANGE): the paper infers only two LECA myosins, a class-1 prototype
  and a second prototype ancestral to all other classes; so class-1 vs every other class is a pre-LECA split. All other classes
  are post-LECA, mostly lineage-specific inventions whose parent class is not resolved, so the non-class-1 node is U (no class-vs-class
  level asserted; e.g. class-22 dated to Amorphea but its sister class is not given). Class-2 and class-4: HGT suggested by
  the paper -> U even when single-copy. Other classes: <=1 gene per species -> S polytomy (T2 rule b; no two panel-E species
  share a WGD), else U (rule c). Orphans (Myo_<X>) hang from the U root. Mapping: protocol v1.1 domain rule (motor domains
  ~690 aa; >=98% id over >=90% of query, RBH, >=2-point margin). Kinesin-myosin homology (shared motor fold): no distinct_from
  with E01. Panel-E eukaryotes absent from the source: CYAME, GIAIC. Strains: YEAST=Sc_c, BATDJ=Bad_b, PLAF7=Pf_a. Sebe-Pedros
  2014 (GBE 6:290) was read but not used: its DataS1 headers carry no class labels.'
